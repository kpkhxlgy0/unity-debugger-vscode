name: Bug report
description: Report a reproducible debugger defect using sanitized diagnostics.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste project source, expressions, variable values, or raw logs.
        Use the extension's **Copy Sanitized Diagnostics** command.
  - type: input
    id: editor
    attributes:
      label: Editor version
      placeholder: Tuanjie 2022.3.62t11
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension version
      placeholder: 0.2.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Describe actions and expected/actual behavior without source code.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only output from Copy Sanitized Diagnostics.
      render: text
    validations:
      required: true
