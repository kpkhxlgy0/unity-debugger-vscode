name: Editor compatibility report
description: Report results for an unverified Unity 2022.3 or Unity 6 version.
title: "[Compatibility] "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Do not attach project source or raw debugger values. Sanitized
        diagnostics are sufficient.
  - type: input
    id: editor
    attributes:
      label: Complete Editor version
      placeholder: 2022.3.62f1 or 6000.0.50f1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension version
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Attach and core debugging work
        - Attach works with limitations
        - Attach fails
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and observed limitations
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      render: text
